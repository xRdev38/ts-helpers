name: CI & Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '18.x'
  PNPM_VERSION: '8'        # ou la version que vous utilisez
  REGISTRY_URL: 'https://registry.npmjs.org'

jobs:
  # 1) CI : install, lint, test, build
  ci:
    name: 🛠 CI (install → lint → test → build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint all packages
        run: pnpm nx run-many --target=lint --all

      - name: Run unit tests
        run: pnpm nx run-many --target=test --all --parallel

      - name: Build all packages
        run: pnpm nx run-many --target=build --all --parallel

  # 2) Publish to npm (main branch OR version tag)
  publish:
    name: 📦 Publish packages
    needs: ci
    if: >
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: ${{ env.REGISTRY_URL }}

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate to npm registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Configure npm to use the token for publishing
          npm set //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}

      - name: Publish all workspace packages
        run: |
          # Publie récursivement chaque lib buildable & publishable
          pnpm recursive publish \
            --access public \
            --no-git-checks \
            --registry ${{ env.REGISTRY_URL }}

      - name: Create GitHub Release (si tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
